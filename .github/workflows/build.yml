name: Build macOS and Linux

on:
  workflow_dispatch:   # Allows manual runs from Actions tab
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
concurrency:
  group: KoboHighlightsExporter-build
  cancel-in-progress: false
  
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller dmgbuild

      - name: Build .app with PyInstaller
        run: |
          pyinstaller KoboHighlightsExporter.spec
          mv dist/"Kobo Highlights Exporter".app dist/KoboHighlightsExporter.app

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_temp
          cp -R dist/KoboHighlightsExporter.app dist/dmg_temp/
          dmgbuild -s -D APP_NAME="KoboHighlightsExporter" -D APP_PATH="dist/dmg_temp/KoboHighlightsExporter.app" "KoboHighlightsExporter" dist/KoboHighlightsExporter-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoboHighlightsExporter-macOS
          path: dist/KoboHighlightsExporter-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller appimage-builder

      - name: Build executable with PyInstaller
        run: |
          pyinstaller KoboHighlightsExporter.spec
          mv dist/"Kobo Highlights Exporter" dist/KoboHighlightsExporter

      - name: Create AppImage
        run: |
          mkdir -p appimage
          cp -r dist/KoboHighlightsExporter appimage/
          mkdir -p appimage/KoboHighlightsExporter.AppDir/usr/bin
          mv appimage/KoboHighlightsExporter appimage/KoboHighlightsExporter.AppDir/usr/bin/
          echo -e '#!/bin/bash\nexec "$(dirname "$0")/usr/bin/KoboHighlightsExporter"' > appimage/KoboHighlightsExporter.AppDir/AppRun
          chmod +x appimage/KoboHighlightsExporter.AppDir/AppRun
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool appimage/KoboHighlightsExporter.AppDir dist/KoboHighlightsExporter-linux.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoboHighlightsExporter-linux
          path: dist/KoboHighlightsExporter-linux.AppImage
