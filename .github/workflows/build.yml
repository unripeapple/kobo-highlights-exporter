name: Build Desktop App

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pyinstaller

      - run: pyinstaller "Kobo Highlights Exporter.spec"

      - name: Package
        run: |
          cp README.md dist/
          cd dist
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            zip -r KoboHighlightsExporter-macOS.zip .
          else
            tar czf KoboHighlightsExporter-Linux.tar.gz .
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
