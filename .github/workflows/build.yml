name: Build Desktop App

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: pyinstaller "Kobo Highlights Exporter.spec"

      - name: Prepare package
        run: |
          cp README.md dist/
          cd dist

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            zip -r KoboHighlightsExporter-${{ github.ref_name }}-macOS.zip .
          else
            tar czf KoboHighlightsExporter-${{ github.ref_name }}-Linux.tar.gz .
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
