name: Build Desktop App

on:
  push:
    branches: [ created ]
  workflow_dispatch:

jobs:

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller "Kobo Highlights Exporter.spec"

      - name: Zip macOS app
        run: |
          cd dist
          zip -r "Kobo Highlights Exporter.app.zip" "Kobo Highlights Exporter.app"
      
      - name: Upload macOS release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/Kobo\ Highlights\ Exporter.app.zip
          asset_name: Kobo\ Highlights\ Exporter.app.zip
          asset_content_type: application/zip
    
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoboHighlightsExporter-macOS
          path: dist/Kobo Highlights Exporter/

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller "Kobo Highlights Exporter.spec"

      - name: Zip Linux binary
        run: |
          cd dist
          zip "Kobo Highlights Exporter-linux.zip" "Kobo Highlights Exporter"
      
      - name: Upload Linux release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/Kobo\ Highlights\ Exporter-linux.zip
          asset_name: Kobo\ Highlights\ Exporter-linux.zip
          asset_content_type: application/zip

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoboHighlightsExporter-linux
          path: dist/Kobo Highlights Exporter/
