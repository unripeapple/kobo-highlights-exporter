name: Build Desktop App

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pyinstaller

      - run: pyinstaller "Kobo Highlights Exporter.spec"

      - name: Package
        run: |
          cp README.md dist/
          cd dist
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            zip -r KoboHighlightsExporter-macOS.zip .
          else
            tar czf KoboHighlightsExporter-Linux.tar.gz .
          fi

      - name: Upload macOS asset
        if: runner.os == 'macOS'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/KoboHighlightsExporter-macOS.zip
          asset_name: KoboHighlightsExporter-macOS.zip
          asset_content_type: application/zip

      - name: Upload Linux asset
        if: runner.os == 'Linux'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/KoboHighlightsExporter-Linux.tar.gz
          asset_name: KoboHighlightsExporter-Linux.tar.gz
          asset_content_type: application/gzip
