name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: pyinstaller "Kobo Highlights Exporter.spec"

      - name: Upload Windows release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/Kobo\ Highlights\ Exporter.exe
          asset_name: KoboHighlightsExporter-${{ github.ref_name }}-Windows-x64.exe
          asset_content_type: application/vnd.microsoft.portable-executable

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App
        run: pyinstaller "Kobo Highlights Exporter.spec"

      - name: Zip macOS app
        run: |
          cd dist
          zip -r KoboHighlightsExporter-${{ github.ref_name }}-macOS.zip "Kobo Highlights Exporter.app"

      - name: Upload macOS release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/KoboHighlightsExporter-${{ github.ref_name }}-macOS.zip
          asset_name: KoboHighlightsExporter-${{ github.ref_name }}-macOS.zip
          asset_content_type: application/zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: pyinstaller "Kobo Highlights Exporter.spec"

      - name: Tar Linux binary
        run: |
          cd dist
          tar czf KoboHighlightsExporter-${{ github.ref_name }}-Linux.tar.gz "Kobo Highlights Exporter"

      - name: Upload Linux release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/KoboHighlightsExporter-${{ github.ref_name }}-Linux.tar.gz
          asset_name: KoboHighlightsExporter-${{ github.ref_name }}-Linux.tar.gz
          asset_content_type: application/gzip
