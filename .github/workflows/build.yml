name: Build Desktop App
concurrency:
  group: build-desktop
  cancel-in-progress: true

permissions:
  contents: write

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  # macOS job
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller "KoboHighlightsExporter.spec"

      - name: Build DMG
        run: |
          brew install create-dmg
      
          mkdir -p dmg
          cp -r "dist/KoboHighlightsExporter.app" dmg/
      
          create-dmg \
            --volname "Kobo Highlights Exporter" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            KoboHighlightsExporter.dmg \
            dmg/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoboHighlightsExporter-macOS
          path: KoboHighlightsExporter.dmg

      - name: Upload macOS release asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: KoboHighlightsExporter.dmg
          asset_name: KoboHighlightsExporter.dmg
          asset_content_type: application/x-apple-diskimage

  # Linux job
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller "KoboHighlightsExporter.spec"

      - name: Build AppImage
        run: |
          sudo apt-get update -y && sudo apt-get install -y libfuse2 wget
      
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-python/releases/download/1.10/linuxdeploy-plugin-python-x86_64.AppImage
      
          chmod +x linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-plugin-python-x86_64.AppImage
      
          mkdir AppDir
          cp -r dist/* AppDir/
      
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin python \
            --output appimage

      - name: Rename AppImage
        run: mv *.AppImage KoboHighlightsExporter.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoboHighlightsExporter-Linux
          path: KoboHighlightsExporter.AppImage

      - name: Upload Linux release asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: KoboHighlightsExporter.AppImage
          asset_name: KoboHighlightsExporter.AppImage
          asset_content_type: application/octet-stream
