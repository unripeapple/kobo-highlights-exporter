name: Build macOS App x86_64

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Set up Python (Intel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Verify Python architecture
        run: |
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies (x86_64)
        run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install -r requirements.txt
          arch -x86_64 python -m pip install pyinstaller
          arch -x86_64 brew install create-dmg

      - name: Build app
        run: |
          arch -x86_64 pyinstaller KoboHighlightsExporter_x86_64macOS.spec

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Kobo Highlights Exporter" \
            --window-size 800 400 \
            --background "assets/dmg-background.png" \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "KoboHighlightsExporter_x86_64.dmg" \
            "dist/Kobo Highlights Exporter.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KoboHighlightsExporter-macOS-x86_64
          path: "*.dmg"
